# Praktikum 3 Komputasi Awan - Allfridho Prima Anjaynata Saragi (102062400045)
# Target Web App: web-praktikum-allfridho.azurewebsites.net
# ==============================================================================

name: Build and Deploy PHP app to Azure Web App - web-praktikum-allfridho

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, openssl

      - name: Validate PHP Syntax (Linting)
        run: |
          echo "Memvalidasi seluruh berkas PHP dalam repositori..."
          find . -name "*.php" -not -path "./vendor/*" -not -path "./.git/*" -exec php -l {} \;

      - name: Upload Artifact for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download Artifact from Build
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'web-praktikum-allfridho'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: .
